<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Birthday Princess Surprise 🎂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

body {
    margin:0;
    padding:0;
    font-family: 'Pacifico', cursive;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    background: linear-gradient(135deg,#ffb6c1,#ffe4e1,#f8c8dc);
    color:#fff;
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    margin: 15px 0;
    text-shadow: 2px 2px #ff69b4,4px 4px #ffccff;
    animation: rainbowShadow 5s linear infinite alternate;
    z-index:2;
    position: relative;
}
@keyframes rainbowShadow {
    0% { text-shadow:2px 2px #ff6f61,4px 4px #ffccff;}
    25% { text-shadow:2px 2px #ffcc00,4px 4px #ff99cc;}
    50% { text-shadow:2px 2px #66ffcc,4px 4px #ff66ff;}
    75% { text-shadow:2px 2px #ff6699,4px 4px #66ccff;}
    100% { text-shadow:2px 2px #ff6f61,4px 4px #ffccff;}
}

button {
    padding: 12px 35px;
    font-size: 1.2rem;
    border: none;
    border-radius: 25px;
    background: linear-gradient(45deg,#ff69b4,#ffccff);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 15px #fff,0 0 30px #ff6f61;
    transition: all 0.3s ease;
    z-index:2;
}
button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px #fff,0 0 60px #ff6f61;
}

#giftMessage {
    display:none;
    margin-top: 10px;
    font-size: 1.3rem;
    padding: 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.3);
    color: #fff;
}

/* Cake container */
#cakeContainer {
    display:none; /* hidden initially */
    width: 80%; /* responsive */
    max-width: 300px; /* smaller on mobile */
    margin: 15px auto;
    z-index:2;
}

/* Ensure SVG scales fully */
#cakeContainer svg {
    width: 100%;
    height: auto;
}

/* Balloons */
.balloon {
    position: absolute;
    width: 25px; /* smaller on mobile */
    height: 40px;
    border-radius: 50%;
    opacity:0.9;
    animation: floatUp linear infinite;
}
.balloon::after {
    content:'';
    position: absolute;
    width:2px;
    height:20px;
    background:#555;
    left:50%;
    transform: translateX(-50%);
    bottom:-20px;
}

/* Fireworks */
.firework {
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background: yellow;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    0% {transform: scale(0); opacity:1;}
    100% {transform: scale(5) translate(var(--x), var(--y)); opacity:0;}
}

/* Sparkles */
.sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    opacity:0.8;
    animation: sparkleAnim 2s linear infinite;
}
@keyframes sparkleAnim {
    0% {transform: translate(0,0) scale(1); opacity:1;}
    100% {transform: translate(80px,-250px) scale(0); opacity:0;}
}

/* Confetti */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ff0;
    opacity:0.9;
    animation: confettiFall linear infinite;
}
@keyframes confettiFall {
    0% {transform: translateY(-10px) rotate(0deg); opacity:1;}
    100% {transform: translateY(110vh) rotate(720deg); opacity:0;}
}
</style>
</head>
<body>

<h1>🎉 Happy Birthday Princess! 👑🎀</h1>
<button id="openGift">💖 Open Surprise 💖</button>
<div id="giftMessage">✨ Wishing you a magical day full of sparkles and happiness! 💕</div>

</div>

<script>
// Elements
const button = document.getElementById('openGift');
const gift = document.getElementById('giftMessage');
const cakeContainer = document.getElementById('cakeContainer');

button.addEventListener('click', () => {
    gift.style.display = 'block';
    button.style.display = 'none';
    cakeContainer.style.display = 'block'; // show cake
    createBalloons(20);
    createSparkles(25);
    createConfetti(40);
    launchFireworks(10);
});

// BALLOONS
function createBalloons(count){
    const colors = ['#ff4d6d','#ffcc00','#ff66ff','#66ccff','#ff99cc','#99ff66','#ffa500','#ff69b4'];
    for(let i=0;i<count;i++){
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');
        balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
        balloon.style.left = Math.random()*window.innerWidth+'px';
        balloon.style.animationDuration = (Math.random()*6+4)+'s';
        document.body.appendChild(balloon);
        setTimeout(()=>balloon.remove(),10000);
    }
}

// SPARKLES
function createSparkles(count){
    for(let i=0;i<count;i++){
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        sparkle.style.left = Math.random()*window.innerWidth+'px';
        sparkle.style.top = Math.random()*window.innerHeight+'px';
        sparkle.style.animationDuration = (Math.random()*2+1)+'s';
        document.body.appendChild(sparkle);
        setTimeout(()=>sparkle.remove(),4000);
    }
}

// CONFETTI
function createConfetti(count){
    for(let i=0;i<count;i++){
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random()*window.innerWidth+'px';
        confetti.style.background = `hsl(${Math.random()*360},100%,50%)`;
        confetti.style.animationDuration = (Math.random()*3+2)+'s';
        document.body.appendChild(confetti);
        setTimeout(()=>confetti.remove(),5000);
    }
    setTimeout(()=>createConfetti(count),4000);
}

// FIREWORKS
function launchFireworks(count){
    for(let i=0;i<count;i++){
        const firework = document.createElement('div');
        firework.classList.add('firework');
        firework.style.left = Math.random()*window.innerWidth+'px';
        firework.style.top = Math.random()*window.innerHeight/2+'px';
        firework.style.setProperty('--x',(Math.random()*200-100)+'px');
        firework.style.setProperty('--y',(Math.random()*200-100)+'px');
        document.body.appendChild(firework);
        setTimeout(()=>firework.remove(),1000);
    }
    setTimeout(()=>launchFireworks(count),1200);
}
</script>
